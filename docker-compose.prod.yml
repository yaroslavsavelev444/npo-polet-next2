# Боевой стек polet-next.
#
# ⚠ Образы здесь только ЗАПУСКАЮТСЯ. Секции `build:` в этом файле больше нет:
# оба образа собирает GitHub Actions и кладёт в GHCR, а deploy/deploy.sh их
# скачивает и подставляет теги через IMAGE_APP/IMAGE_TOOLS. Файл читается
# только как часть выкладки — прямой `docker compose up` без этих переменных
# намеренно падает с понятной ошибкой (см. `:?` ниже), а не поднимает
# что-нибудь не то.
#
# ─── Данные ─────────────────────────────────────────────────────────────────
#
# У томов проставлены ЯВНЫЕ имена. Без них имя тома складывается из имени
# проекта и ключа (`polet-next` + `postgres_data`), то есть переименование
# проекта, запуск без `-p` или переезд каталога тихо создают ПУСТОЙ том и
# поднимают чистую базу рядом с боевой. Явное имя делает это невозможным:
# том находится по имени, откуда бы ни запускали compose.
#
# Имена сверены с сервером (`docker volume ls`): polet-next_postgres_data,
# polet-next_media_data, polet-next_redis_data — это существующие тома с
# боевыми данными. Менять их нельзя.

# ─── Пути внутри файла ──────────────────────────────────────────────────────
#
# `.env.production` и другие относительные пути разрешаются от КАТАЛОГА
# ПРОЕКТА, а не от места, где лежит этот файл. Сам файл живёт в
# /home/y4s/polet-next/releases/<sha>/, поэтому deploy/deploy.sh всегда
# передаёт `--project-directory /home/y4s/polet-next`. Так запись ниже
# остаётся простым `.env.production`, а секреты не копируются в каждую
# выкладку.

name: polet-next

# Базовый профиль безопасности для КАЖДОГО контейнера проекта.
#
# Почему это не «на всякий случай»: без no-new-privileges процесс внутри
# контейнера может повысить права через setuid-бинарь (в образах Debian/Alpine
# их десяток — su, mount, passwd), превратив исполнение произвольного кода в
# root внутри контейнера. cap_drop: ALL убирает набор возможностей, который
# Docker выдаёт по умолчанию и который приложению не нужен ни одной из них
# (NET_RAW — сырые сокеты и ARP-спуфинг внутри сети проекта, MKNOD, SETFCAP,
# SYS_CHROOT и т.д.).
#
# Соседний проект (comersi) уже работает с cap_drop: ALL и no-new-privileges —
# polet-next был единственным стеком на хосте без единого ограничения.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-logging: &default-logging
  # Без ограничения json-file растёт до размера диска. Ротация — не оптимизация,
  # а защита от «сервер встал, потому что кончилось место под логи».
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    container_name: polet-next-postgres-prod
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Официальный образ стартует от root и переключается на postgres через
    # gosu — поэтому полный cap_drop здесь невозможен, возвращаем ровно те
    # пять возможностей, которые для этого нужны (смена владельца PGDATA и
    # сброс привилегий), и ничего сверх.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Потолок памяти — защита от того, что один сервис уронит весь хост.
    # 2 ГБ при базе в 23 МБ — с большим запасом.
    mem_limit: 2g
    pids_limit: 256
    environment:
      POSTGRES_DB: npo_polet
      POSTGRES_USER: npo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npo_user -d npo_polet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]

  # ⚠ Redis хранит НЕ кэш. В нём лежат pending-auth челленджи — а внутри них
  # выданный payload.login() JWT, который ждёт подтверждения OTP (см.
  # src/modules/auth/lib/pendingAuth.ts), плюс состояние всех rate limit'ов.
  # До этой правки он работал БЕЗ ПАРОЛЯ: любой процесс, дотянувшийся до сети
  # проекта (SSRF в приложении, скомпрометированный соседний контейнер),
  # читал токены незавершённых входов и обнулял защиту от брутфорса одной
  # командой. Пароль здесь — не формальность, а граница вокруг аутентификации.
  redis:
    image: redis:8-alpine
    container_name: polet-next-redis-prod
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    mem_limit: 512m
    pids_limit: 128
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан в .env.production}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD не задан в .env.production}
      # Потолок памяти внутри самого Redis, а не только через cgroup: при
      # переполнении cgroup процесс убивает OOM-killer, а здесь Redis сам
      # вытеснит просроченное. volatile-ttl (а не allkeys-*) — потому что
      # вытеснять можно ТОЛЬКО ключи с TTL: у BullMQ часть ключей вечная, и
      # их вытеснение означало бы потерю задач.
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - volatile-ttl
      # rename-command здесь СОЗНАТЕЛЬНО НЕТ. Проверено на redis:8-alpine:
      # образ загружает модули (ReJSON, search), и директива rename-command в
      # аргументах приводит к «Unresolved Configuration(s) Detected» и выходу
      # с кодом 1 — контейнер никогда не становится healthy, а вместе с ним не
      # стартует app. Ограничивать набор команд в Redis 7+ полагается через
      # ACL, а не rename-command; требование аутентификации выше закрывает
      # основной сценарий.
    healthcheck:
      # С паролем прежний `redis-cli ping` возвращает NOAUTH, контейнер
      # навсегда остаётся unhealthy, а app с depends_on: service_healthy
      # просто не стартует. Пароль берём из переменной окружения самого
      # контейнера ($$ — экранирование для compose, чтобы подстановку делал
      # шелл внутри, а не compose снаружи).
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [data]

  # Одноразовый служебный контейнер: миграции Payload и статический guard
  # графа импортов payload.config.ts.
  #
  # Запускается ТОЛЬКО как `--profile tools run --rm migrate`, поэтому у него
  # нет ни restart, ни healthcheck: обычный `up` его не касается вовсе.
  migrate:
    image: ${IMAGE_TOOLS:?IMAGE_TOOLS не задан — запускать этот compose-файл нужно через deploy/deploy.sh}
    <<: *hardening
    mem_limit: 1g
    pids_limit: 256
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, data]
    profiles: ["tools"]

  app:
    image: ${IMAGE_APP:?IMAGE_APP не задан — запускать этот compose-файл нужно через deploy/deploy.sh}
    container_name: polet-next-app-prod
    restart: unless-stopped
    logging: *default-logging
    <<: *hardening
    # Образ runner работает под непривилегированным nextjs (uid 1001) и слушает
    # порт > 1024 — ни одна из capability Docker'а по умолчанию ему не нужна.
    mem_limit: 2g
    pids_limit: 512
    env_file: .env.production
    ports:
      # Наружу порт не публикуется: перед приложением стоит nginx на хосте
      # (/etc/nginx/sites-enabled/npo-polet.ru.conf → upstream 127.0.0.1:3004).
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    # Две сети: internal даёт выход наружу (SMTP, DaData), data — доступ к
    # базе и Redis. Сами postgres/redis стоят ТОЛЬКО в data, у которой нет
    # шлюза, поэтому из них невозможно инициировать исходящее соединение:
    # скомпрометированная СУБД не сможет ни выгрузить дамп, ни постучаться в
    # чужой контейнер на хосте.
    networks: [internal, data]

  # Отложенное удаление аккаунтов: отдельный long-running процесс, чтобы
  # рестарты веб-приложения не теряли работу очереди.
  #
  # ⚠ В профиле, то есть обычным `up` НЕ поднимается — и это осознанно.
  # На сервере этот воркер не запускался никогда (на момент перехода в
  # проекте polet-next работали ровно три контейнера: postgres, redis, app).
  # Он безвозвратно удаляет пользовательские данные по истечении 14 дней,
  # поэтому включать его «заодно», в рамках правки процесса выкладки, нельзя:
  # это изменение поведения продукта, а не инфраструктуры, и решение принимает
  # владелец.
  #
  # Включить осознанно (после проверки, что накопившиеся заявки — те, которые
  # действительно нужно исполнить):
  #   cd /home/y4s/polet-next/current
  #   IMAGE_TOOLS=<тег из .deploy-state/last_successful_sha> \
  #     docker compose --env-file ../.env.production -p polet-next \
  #     --profile workers up -d account-deletion-worker
  # Чтобы он поднимался при каждой выкладке — добавьте "workers" в
  # COMPOSE_PROFILES в deploy/deploy.sh.
  account-deletion-worker:
    image: ${IMAGE_TOOLS:?IMAGE_TOOLS не задан — запускать этот compose-файл нужно через deploy/deploy.sh}
    container_name: polet-next-account-deletion-worker-prod
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    command: ["node_modules/.bin/tsx", "src/modules/account-deletion/worker.ts"]
    <<: *hardening
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal, data]
    profiles: ["workers"]

volumes:
  postgres_data:
    name: polet-next_postgres_data
  redis_data:
    name: polet-next_redis_data
  media_data:
    name: polet-next_media_data

networks:
  # Сеть с выходом в интернет. Нужна только приложению: письма уходят на
  # smtp.yandex.ru, подсказки адресов — в DaData.
  internal:
    name: polet-next-internal
    driver: bridge

  # internal: true — у сети нет шлюза наружу. Postgres и Redis подключены
  # ТОЛЬКО сюда: им незачем ходить в интернет, а отсутствие маршрута убирает
  # целый класс последствий компрометации (выгрузка базы наружу, reverse
  # shell, обращение к соседним проектам на этом же хосте). DNS внутри
  # docker-сети при этом работает, поэтому app по-прежнему находит их по
  # именам `postgres` и `redis`.
  data:
    name: polet-next-data
    driver: bridge
    internal: true
