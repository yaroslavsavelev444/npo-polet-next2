name: polet-next

services:
  postgres:
    image: postgres:17
    container_name: polet-next-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: npo_polet
      POSTGRES_USER: npo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npo_user -d npo_polet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:8-alpine
    container_name: polet-next-redis-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    networks: [internal]

  # Одноразовый служебный контейнер: миграции и graph-guard.
  # Запускается ТОЛЬКО через `--profile tools run --rm migrate <команда>`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: base-builder
    image: polet-next-migrate:${IMAGE_TAG:-latest}
    env_file: .env.production
    command: ["pnpm", "payload", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    profiles: ["tools"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      # network: polet-next-internal
      # Секреты сборки (DATABASE_URI/PAYLOAD_SECRET) передаются через
      # BuildKit-секрет prod_env вместо build args — так они не оседают в
      # слоях/метаданных образа. Извлекаются в Dockerfile (builder-стейдж).
      secrets:
        - prod_env
    image: polet-next:${IMAGE_TAG:-latest}
    container_name: polet-next-app-prod
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks: [internal]

  # Отдельный long-running процесс: обрабатывает отложенные заявки на удаление
  # после 14-дневного периода. Не запускаем его внутри Next.js, чтобы рестарты
  # веб-приложения не теряли работу очереди.
  account-deletion-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # Отдельный стейдж вместо base-builder: тот не задаёт USER, и этот
      # долгоживущий процесс работал в проде от root. Стейдж worker — то же
      # содержимое, но под непривилегированным nextjs (см. Dockerfile).
      # ВНИМАНИЕ: образ переименован, поэтому после выката его нужно один раз
      # пересобрать явно:
      #   docker compose -f docker-compose.prod.yml build account-deletion-worker
      #   docker compose -f docker-compose.prod.yml up -d account-deletion-worker
      # (deploy.sh этот сервис не трогает вовсе — см. отчёт по аудиту).
      target: worker
    image: polet-next-worker:${IMAGE_TAG:-latest}
    container_name: polet-next-account-deletion-worker-prod
    restart: unless-stopped
    env_file: .env.production
    command: ["pnpm", "worker:account-deletion"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  media_data:

# Секрет сборки: весь .env.production монтируется в builder-стейдж только на
# время RUN (см. Dockerfile) и не попадает в слои образа. На хосте файл уже
# обязателен для деплоя (deploy.sh проверяет его наличие).
secrets:
  prod_env:
    file: .env.production

networks:
  internal:
    name: polet-next-internal
    driver: bridge
