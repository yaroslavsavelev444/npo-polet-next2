packages:
  - .

# Патчим уязвимые транзитивные зависимости (pnpm audit --prod).
# undici — high: обход проверки TLS-сертификата, request smuggling, header
# injection. dompurify — prototype pollution → XSS. postcss — XSS через
# незакрытый </style>. esbuild — раскрытие ответов dev-сервера.
# Диапазоны держим в пределах той же мажорной версии, что тянул payload/next,
# чтобы закрыть CVE без мажорного апгрейда транзитивной зависимости.
overrides:
  # Нижние границы подняты до реально исправленных версий: прежние
  # (undici 7.28.0, dompurify 3.4.11, postcss 8.5.10) резолвились в сборки,
  # которые advisory всё ещё считает уязвимыми — override был, а дыра
  # оставалась. Сверяться нужно с "Patched versions" из `pnpm audit`,
  # а не с версией, в которой проблему нашли.
  undici: '>=7.29.0 <8.0.0'
  dompurify: '>=3.4.13 <4.0.0'
  postcss: '>=8.5.23 <9.0.0'
  esbuild: '>=0.24.3'
  # Сборочные/транзитивные зависимости, попадающие в prod-дерево
  # (`pnpm audit --prod`). Диапазоны в пределах текущего мажора.
  browserslist: '>=4.28.7 <5.0.0'
  fast-uri: '>=3.1.5 <4.0.0'
  # image-size: исправленной версии на момент аудита не существует (последняя
  # опубликованная 2.0.2 и есть уязвимая) — override поставить не на что.
  # Путь эксплуатации — разбор размеров загружаемого изображения; загрузка в
  # media доступна только персоналу (Media.create: isAdminOrSuperAdmin).
  immutable: '>=4.3.9 <5.0.0'
  js-yaml: '>=4.3.1 <5.0.0'
  nanoid: '>=3.3.18 <4.0.0'
  # brace-expansion живёт в двух мажорах одновременно (v1 у minimatch/eslint,
  # v5 у современного glob) — поднимаем каждый в пределах своего, иначе
  # единый диапазон сломал бы CJS-потребителей v1. В prod-дерево пакет не
  # входит вовсе (только сборочный инструментарий), но ReDoS чинится
  # патч-версией и не требует ничего взамен.
  'brace-expansion@1': '>=1.1.18 <2.0.0'
  'brace-expansion@5': '>=5.0.9 <6.0.0'

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tsx@4.23.1
