# Чат поддержки — фрагмент nginx для хоста админки (admin.npo-polet.ru).
#
# Конфиг админки в репозитории не хранится (правится на сервере руками), а
# консоль менеджеров (/admin/support) подключается к шлюзу чата со СВОЕГО
# хоста: cookie сессии менеджера host-only, на хост витрины она не уходит.
# Поэтому /realtime/ должен проксироваться и здесь — на тот же шлюз.
#
# Витрина (npo-polet.ru) — уже в nginx.txt. Ниже — что добавить в server{}
# admin.npo-polet.ru. Имена upstream / limit_conn_zone / map берутся те,
# что объявлены в npo-polet.ru.conf (nginx.txt): их пространство имён общее
# на весь nginx, объявлять второй раз нельзя («duplicate upstream»).
#
# Если в конфиге админки нет своего proxy_params с Upgrade/Connection —
# заголовки ниже заданы явно.
#
# Порядок применения: правка → `sudo nginx -t` → `sudo systemctl reload nginx`.

location /realtime/ {
    limit_conn npo_realtime_main 20;
    proxy_pass http://polet_support_main;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_npo_main;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}
