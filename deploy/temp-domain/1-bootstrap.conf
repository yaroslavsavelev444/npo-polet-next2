# /etc/nginx/sites-available/npo-polet.online.conf — ШАГ 1 из 3 (временно)
#
# Временный домен на время недоступности npo-polet.ru (сбой DNS регистратора
# Beget 02.11.2026). Порядок и смысл всех шагов — deploy/temp-domain/README.md.
#
# Этот файл нужен ровно один раз: отдать certbot'у проверочный файл по HTTP,
# пока сертификата ещё нет. Сразу с 2-site.conf начать нельзя — nginx -t
# падает на отсутствующем ssl_certificate.
#
# Другое имя домена — заменить во всех трёх файлах:
#   sed -i 's/npo-polet\.online/НОВЫЙ-ДОМЕН/g' 1-bootstrap.conf 2-site.conf 3-redirect.conf

server {
    listen 80;
    listen [::]:80;
    server_name npo-polet.online www.npo-polet.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
