# /etc/nginx/sites-available/npo-polet.online.conf — ШАГ 2 из 3 (пока лежит npo-polet.ru)
#
# Вторая «дверь» в тот же сайт. Сборка не меняется и по-прежнему считает себя
# npo-polet.ru: canonical, sitemap, микроразметка, фид, ссылки в письмах
# остаются на основном домене (src/resources/content.tsx, NEXT_PUBLIC_APP_URL).
# Поэтому временный домен закрыт от индексации — он не должен ни стать
# зеркалом, ни «переехать» вместо основного. Подробности — README.md рядом.
#
# Upstream'ы, зоны limit_req/limit_conn, map и кэш TLS-сессий объявлены в
# npo-polet.ru.conf (nginx.txt) — здесь на них только ссылки: у nginx общее
# пространство имён, повторное объявление роняет nginx -t ("duplicate ...").
# Значит, npo-polet.ru.conf должен оставаться включённым.
#
# Перед включением:
#   1. Сертификат выпущен (README.md, шаг certbot).
#   2. https://npo-polet.online добавлен в ALLOWED_ORIGINS, deploy.sh --restart
#      выполнен — иначе вход, корзина и чат на этом домене не работают.

server {
    listen 80;
    listen [::]:80;
    server_name npo-polet.online www.npo-polet.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://npo-polet.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.npo-polet.online;

    ssl_certificate     /etc/letsencrypt/live/npo-polet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npo-polet.online/privkey.pem;

    return 301 https://npo-polet.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name npo-polet.online;

    ssl_certificate     /etc/letsencrypt/live/npo-polet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npo-polet.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_npo_main:10m;
    ssl_session_timeout 1d;

    # HSTS намеренно нет: домен временный, обязательства на год браузерам
    # не даём.
    #
    # X-Robots-Tag — в каждом location с собственным add_header тоже: nginx
    # не наследует add_header уровня server{} в location, где есть свой.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    # Буферы под заголовок ответа Next — см. nginx.txt, без них 502.
    proxy_buffer_size       32k;
    proxy_buffers           8 32k;
    proxy_busy_buffers_size 64k;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # Свой robots.txt вместо приложения: приложение отдаёт robots основного
    # домена с sitemap на npo-polet.ru.
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Товарный фид и sitemap ссылаются на основной домен — с временного их
    # не отдаём, чтобы Директ и поисковики не подхватили второй адрес.
    location ~* ^/(sitemap\.xml$|feed/) {
        return 404;
    }

    location ~* ^/api/(admins|users)/login {
        limit_req zone=npo_auth_main burst=5 nodelay;
        proxy_pass http://polet_next_main;
        include /etc/nginx/proxy_params_npo_main.conf;
    }

    location ~* ^/(_next/static)/ {
        proxy_pass http://polet_next_main;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /media/ {
        proxy_pass http://polet_next_main;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Чат поддержки — как в nginx.txt. Шлюз сверяет Origin с ALLOWED_ORIGINS.
    location /realtime/ {
        limit_conn npo_realtime_main 20;
        proxy_pass http://polet_support_main;
        include /etc/nginx/proxy_params_npo_main.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://polet_next_main;
        include /etc/nginx/proxy_params_npo_main.conf;
    }

    access_log /var/log/nginx/polet-online.access.log;
    error_log  /var/log/nginx/polet-online.error.log;
}
