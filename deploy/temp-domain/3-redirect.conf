# /etc/nginx/sites-available/npo-polet.online.conf — ШАГ 3 из 3 (npo-polet.ru снова работает)
#
# Временный домен больше не обслуживает сайт, а постоянно (301) ведёт на тот
# же путь основного домена: ссылки из Telegram, переписки и закладки
# покупателей продолжают работать. Держать минимум год, домен не бросать —
# иначе его перекупят вместе с трафиком по этим ссылкам.
#
# acme-challenge оставлен: certbot продолжает продлевать сертификат, без него
# HTTPS-ссылки на временный домен упрутся в ошибку сертификата, а не в
# редирект.

server {
    listen 80;
    listen [::]:80;
    server_name npo-polet.online www.npo-polet.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://npo-polet.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name npo-polet.online www.npo-polet.online;

    ssl_certificate     /etc/letsencrypt/live/npo-polet.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npo-polet.online/privkey.pem;

    return 301 https://npo-polet.ru$request_uri;
}
