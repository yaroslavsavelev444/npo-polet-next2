# Выкладка на VPS при попадании кода в master.
#
# ─── Главное решение: образы собираются здесь, а не на сервере ──────────────
#
# Раньше выкладка сводилась к `ssh vps 'git pull && docker compose build'`.
# Для этого продукта это плохой обмен:
#
#  * `next build` с Payload — тяжёлая сборка. На VPS она конкурирует за память
#    с работающей базой и приложением, а при нехватке падает по OOM: отказ
#    выкладки вызывается не кодом, а тем, что рядом кто-то открыл страницу;
#  * сборка на сервере означает, что НЕУДАЧНАЯ СБОРКА ПРОИСХОДИТ В ПРОДЕ,
#    поверх уже выполненного `git reset --hard`;
#  * откат при сборке на месте — это ещё одна сборка. Здесь предыдущий образ
#    уже лежит на диске, и откат — это `up -d` с прошлым тегом, секунды;
#  * на сервере накопилось 20 ГБ build-кэша — прямая цена сборки в проде.
#
# Поэтому: CI собирает два образа, кладёт их в GHCR с тегом = SHA коммита, и
# сервер их СКАЧИВАЕТ. На VPS не нужен ни исходный код, ни инструментарий, ни
# buildx.
#
# ─── И почему на сервере больше нет git ─────────────────────────────────────
#
# Конфигурацию (docker-compose.prod.yml и deploy/) привозит по SSH сам этот
# workflow, в каталог releases/<sha>/. Раньше её забирал `git fetch` на
# сервере — и падал с «could not read Username for https://github.com»,
# потому что репозиторий приватный, remote указан по HTTPS, а учётных данных
# в неинтерактивной сессии нет и быть не может. Механизма больше нет, вместе
# с ним нет и класса ошибок: доступ к приватному репозиторию с боевой машины
# не требуется вовсе.

name: Deploy

on:
  push:
    branches: [master]
  # Ручной запуск: перевыкатить текущий master, не делая пустого коммита.
  workflow_dispatch:

# ⚠ `cancel-in-progress: false`, в отличие от CI. Отменённая на середине
# выкладка оставляет сервер в состоянии, которого не хотел никто. Второй пуш
# дождётся первого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  NODE_VERSION: "22"

  # `git init` внутри actions/checkout не находит init.defaultBranch и на каждом
  # job'е печатает девять строк подсказки «Using 'master' as the name for the
  # initial branch...». Это не про репозиторий — раннер создаёт пустой .git с
  # нуля, — но в логе выглядит ровно как предупреждение. Переменные
  # GIT_CONFIG_* задают настройку без правки глобального конфига (который
  # checkout всё равно подменяет на временный) и гасят подсказку.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  # ── Проверки перед сборкой ────────────────────────────────────────────────
  #
  # Дублируют CI намеренно: `workflow_dispatch` и слияние в обход защиты ветки
  # не должны приводить к выкладке непроверенного кода. Барьер стоит там, где
  # последствия, а не там, где удобно.
  verify:
    name: Проверки
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci
      - run: node scripts/verify-payload-graph.mjs
      - run: pnpm test
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci

  # ── Сборка и публикация образов ───────────────────────────────────────────
  build:
    name: Образы
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: read
      # Право писать в GitHub Container Registry. Токен выдаётся на один
      # прогон — отдельный секрет с паролем реестра заводить не нужно.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имена образов должны быть в нижнем регистре: GHCR отвергает теги с
      # заглавными буквами, а github.repository повторяет написание владельца
      # и репозитория как есть.
      - name: Имя образа
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # ⚠ NEXT_PUBLIC_* — АРГУМЕНТЫ СБОРКИ, а не переменные запуска: Next
      # подставляет их в код на этапе компиляции. Задать их в .env.production
      # на сервере недостаточно — в образе уже стоит то, что было при сборке.
      # Секретов среди них нет и быть не должно: боевые ключи читаются при
      # запуске из .env.production, и сборка их не видит вовсе.
      - name: Образ приложения
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-app:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-app:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_YM_ID=${{ vars.NEXT_PUBLIC_YM_ID }}
          # Кеш слоёв между прогонами: без него каждая сборка ставит
          # зависимости заново.
          #
          # ⚠ `ignore-error=true` — потому что выгрузка кеша не имеет права
          # ронять выкладку: образ к этому моменту уже собран и отправлен в
          # реестр, а кеш — всего лишь ускорение следующего прогона.
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max,ignore-error=true

      - name: Образ инструментов (миграции, воркеры)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tools
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-tools:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.name.outputs.repo }}-tools:latest
          # ⚠ `mode=min`, а не `max`. С `mode=max` сюда выгружались бы слои
          # всех промежуточных стадий, включая node_modules целиком. Кеш
          # GitHub Actions ограничен 10 ГБ на репозиторий; два образа по
          # `mode=max` в него не помещаются, и каждый прогон вытеснял бы
          # предыдущий, переписывая гигабайты — сборка выглядит зависшей на
          # «exporting to GitHub Actions Cache» до отмены по таймауту.
          # Стадия `deps` (node_modules) всё равно общая с образом приложения
          # и приезжает из его кеша.
          cache-from: |
            type=gha,scope=tools
            type=gha,scope=app
          cache-to: type=gha,scope=tools,mode=min,ignore-error=true

  # ── Выкладка ──────────────────────────────────────────────────────────────
  deploy:
    name: Выкладка на VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # Токен, который уезжает на сервер как GHCR_TOKEN, должен уметь ровно одно
    # — скачать образ. Без явного блока он получил бы права по умолчанию, то
    # есть в типовой настройке запись во всё. Секрет, передаваемый по SSH на
    # другую машину, не должен быть шире задачи.
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v7

      # То же приведение к нижнему регистру, что и в job'е сборки: имя образа
      # должно совпасть с тем, под которым он опубликован, иначе `docker pull`
      # на сервере не найдёт тег.
      - name: Имя образа
        id: name
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Ключ SSH
        # Ключ живёт в агенте, а не в файле на диске раннера: файл пришлось бы
        # удалять самому, и любой упавший шаг оставил бы его лежать.
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Отпечаток сервера
        # known_hosts из секрета, а НЕ `StrictHostKeyChecking=no`: отключённая
        # проверка означает, что выкладка пойдёт на любой сервер, который
        # окажется по этому адресу.
        #
        # ⚠ Секрет снимается командой `ssh-keyscan -p 48965 <хост>`. При
        # нестандартном порте запись имеет вид `[адрес]:порт` и с записью,
        # снятой без `-p`, не совпадёт — проверка отклонит соединение.
        #
        # ServerAlive* — для каждого ssh ниже: без них соединение, по которому
        # долго не идут данные от раннера, молча умирает где-то в NAT между
        # GitHub и VPS, и ssh узнаёт об этом только при следующей записи
        # («client_loop: send disconnect: Broken pipe»). С ними обрыв
        # обнаруживается за минуту, а не через десять.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'CONFIG'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 30
          CONFIG
          chmod 600 ~/.ssh/config

      # Конфигурация уезжает на сервер архивом по SSH — без git, без rsync и
      # без промежуточных файлов на диске раннера. В bundle только то, что
      # нужно для запуска и обслуживания; исходный код на сервере не нужен, он
      # уже внутри образа.
      - name: Доставка конфигурации в releases/${{ github.sha }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          SHA: ${{ github.sha }}
          PROJECT_DIR: ${{ vars.VPS_PROJECT_DIR || '/home/y4s/polet-next' }}
        run: |
          set -euo pipefail
          # Каталог создаётся заново на каждую выкладку: остатки предыдущей
          # попытки не должны смешиваться с новой конфигурацией.
          ssh -p "$PORT" "$USER@$HOST" \
            "rm -rf '$PROJECT_DIR/releases/$SHA' && mkdir -p '$PROJECT_DIR/releases/$SHA'"
          tar czf - docker-compose.prod.yml deploy scripts/backup \
            | ssh -p "$PORT" "$USER@$HOST" \
              "tar xzf - -C '$PROJECT_DIR/releases/$SHA' && chmod +x '$PROJECT_DIR/releases/$SHA/deploy/'*.sh"

      # ⚠ Выкладка НЕ выполняется внутри SSH-сессии раннера.
      #
      # Раньше здесь был один `ssh ... bash deploy.sh`, и выкладка жила ровно
      # столько, сколько жило соединение. 27.09 оно оборвалось посреди
      # `docker pull` («client_loop: send disconnect: Broken pipe», код 255) —
      # sshd убил deploy.sh вместе с сессией. На скачивании это безвредно, но
      # тот же обрыв во время миграций или подмены контейнеров оставил бы
      # сервер в состоянии, которого не хотел никто, и без автоотката.
      #
      # Теперь deploy/detach.sh запускает deploy.sh отвязанным от сессии
      # (setsid + nohup), а этот шаг только опрашивает его короткими
      # SSH-вызовами и печатает новый кусок лога. Оборвался опрос — следующий
      # продолжит с того же смещения; сама выкладка обрыва не замечает.
      #
      # `bash <путь>`, а не `<путь>` напрямую: скрипт приезжает архивом, и его
      # права зависят от режима файла в дереве git.
      - name: Запуск выкладки
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          # SSH на этом сервере слушает нестандартный порт. Значение живёт в
          # секрете, а не в коде: адрес и порт вместе — это карта входа.
          PORT: ${{ secrets.VPS_SSH_PORT }}
          SHA: ${{ github.sha }}
          PROJECT_DIR: ${{ vars.VPS_PROJECT_DIR || '/home/y4s/polet-next' }}
        run: |
          set -euo pipefail
          remote() { ssh -p "$PORT" "$USER@$HOST" "$@"; }
          DETACH="$PROJECT_DIR/releases/$SHA/deploy/detach.sh"

          # Запуск. Повтор безопасен: detach.sh не стартует вторую выкладку,
          # если первая уже идёт или закончилась.
          started=""
          for attempt in 1 2 3; do
            if remote "GIT_SHA='$SHA' \
                REGISTRY='${{ env.REGISTRY }}' \
                REPO='${{ steps.name.outputs.repo }}' \
                GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
                GHCR_USER='${{ github.actor }}' \
                PROJECT_DIR='$PROJECT_DIR' \
                bash '$DETACH' start"; then
              started=1
              break
            fi
            echo "::warning::Не удалось запустить выкладку (попытка $attempt из 3), повтор через 10 с"
            sleep 10
          done
          [[ -n "$started" ]] || { echo "::error::Выкладку не удалось запустить на сервере"; exit 1; }

          # Опрос. 40 подряд неудачных опросов (~10 минут без связи) — повод
          # сдаться; выкладка при этом продолжается на сервере, её лог —
          # logs/latest.log. Верхняя граница всего шага — timeout-minutes job'а.
          offset=0
          failures=0
          chunk="$(mktemp)"
          while :; do
            sleep 5
            if ! remote "bash '$DETACH' poll $offset" >"$chunk"; then
              failures=$((failures + 1))
              if ((failures >= 40)); then
                echo "::error::Связь с сервером потеряна. Выкладка продолжается там сама — см. $PROJECT_DIR/logs/latest.log"
                exit 1
              fi
              echo "::warning::Опрос сервера не удался ($failures), повтор"
              sleep 10
              continue
            fi
            failures=0

            # Первая строка — состояние, дальше — новый кусок лога байт в байт.
            read -r _ state first second < <(head -n 1 "$chunk")
            tail -n +2 "$chunk"

            case "$state" in
              running) offset="$first" ;;
              exit)
                if [[ "$first" != "0" ]]; then
                  echo "::error::deploy.sh завершился с кодом $first"
                fi
                exit "$first"
                ;;
              lost)
                echo "::error::Процесс выкладки исчез, не сообщив результата (перезагрузка сервера?). См. $PROJECT_DIR/logs/latest.log"
                exit 1
                ;;
              *)
                echo "::error::Непонятный ответ сервера: $(head -n 1 "$chunk")"
                exit 1
                ;;
            esac
          done

  # ── Дымовая проверка снаружи ──────────────────────────────────────────────
  #
  # Отдельным job'ом и ПОСЛЕ выкладки: скрипт на сервере проверяет здоровье
  # изнутри сети compose, а этот шаг — снаружи, через настоящий домен и
  # настоящий TLS. Разница существенная: приложение может быть здорово, а
  # nginx — отдавать 502.
  smoke:
    name: Дымовая проверка
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    steps:
      # ⚠ С повторами, и это не «на всякий случай».
      #
      # Проверка идёт сразу после пересоздания контейнера, а перед приложением
      # стоит nginx, у которого апстрим объявлен с `keepalive 32`
      # (/etc/nginx/sites-enabled/npo-polet.ru.conf). Пул уже установленных
      # соединений указывает на слушающий сокет ПРЕЖНЕГО контейнера, и первые
      # запросы после подмены могут получить 502, пока nginx не обнаружит, что
      # соединения мертвы, и не откроет новые. Приложение при этом полностью
      # исправно — это видно по тому, что прямой запрос на 127.0.0.1:3004
      # отвечает 200.
      #
      # Один запрос в этот момент проверяет удачу, а не работоспособность
      # выкладки. Пять попыток с паузой отличают короткий переходный 502 от
      # действительно сломанного сайта — а если он сломан, шаг всё равно
      # покраснеет, только на 20 секунд позже.
      - name: Публичные страницы отвечают
        env:
          BASE: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          # /sitemap.xml намеренно не проверяется: он обходит все товары и
          # категории, и на медленном ответе дымовая проверка красила бы
          # успешную выкладку в красный, ничего не сообщая о её качестве.
          check() {
            local path="$1" code attempt
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$path" || echo 000)
              if [ "$code" = "200" ]; then
                echo "$path → $code (попытка $attempt)"
                return 0
              fi
              echo "$path → $code, повтор через 5с (попытка $attempt/5)"
              sleep 5
            done
            echo "❌ $path так и не ответил 200 (последний код: $code)"
            return 1
          }
          for path in / /category /robots.txt; do
            check "$path"
          done

      - name: Здоровье приложения
        # /api/health отвечает 200 только когда Payload инициализирован и
        # Postgres доступен. `-f` уронил бы шаг на 503, но тогда в логе не
        # осталось бы тела ответа — поэтому оно сначала печатается.
        env:
          BASE: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            body=$(curl -sS --max-time 25 -w '\n%{http_code}' "$BASE/api/health" || echo -e "\n000")
            code=$(echo "$body" | tail -n1)
            echo "попытка $attempt → $code"
            echo "$body"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "❌ health так и не вернул 200"
          exit 1
