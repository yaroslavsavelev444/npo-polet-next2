# .github/workflows/deploy.yml
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Минимальные права GITHUB_TOKEN на весь workflow: ни одному из шагов не нужен
# доступ на запись в репозиторий, пакеты или деплойменты, а токен по умолчанию
# доступен любому шагу, в том числе коду из pull request.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # На pull_request прод-секреты в сборку НЕ передаются: код в PR
      # выполняется в этом же job'е и может вывести любое доступное ему
      # значение в лог/наружу. Ни type-check, ни next build реального
      # подключения не требуют — payload.config.ts валидируется схемой env.ts,
      # а Local API на этапе сборки подменяется заглушкой (см.
      # src/payload/services/getPayload.ts), поэтому placeholder'ов достаточно.
      - run: pnpm type-check
        env:
          PAYLOAD_SECRET: ${{ github.event_name == 'pull_request' && 'ci-placeholder-secret' || secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ github.event_name == 'pull_request' && 'postgres://ci:ci@localhost:5432/ci' || secrets.DATABASE_URI }}

      - run: pnpm build
        env:
          PAYLOAD_SECRET: ${{ github.event_name == 'pull_request' && 'ci-placeholder-secret' || secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ github.event_name == 'pull_request' && 'postgres://ci:ci@localhost:5432/ci' || secrets.DATABASE_URI }}

  deploy:
    needs: build-and-test
    # Явно и push, и ветка: одного `github.ref` мало как гарантии — условие
    # должно читаться как «деплоим только то, что уже влито в master».
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 48965
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: bash /home/y4s/polet-next/deploy.sh