# Проверки. Идут на каждый pull request и на каждый пуш в master.
#
# ─── Зачем отдельно от выкладки ─────────────────────────────────────────────
#
# Проверки должны отработать ДО слияния — на PR, когда их ещё можно прочитать
# и что-то исправить. Выкладка обязана идти только ПОСЛЕ слияния. Один
# workflow на оба случая означал бы либо выкладку с ветки, либо проверки,
# которые никто не видит вовремя.
#
# На master они повторяются намеренно: слияние может дать состояние, которого
# не было ни в одной ветке.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверять код, который
# уже заменён, — трата минут раннера. В deploy.yml отмена, наоборот,
# выключена — по противоположной причине.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ничего, кроме чтения кода. Без этого блока прогон получает права по
# умолчанию для репозитория, и GITHUB_TOKEN с правом записи оказывается в
# окружении каждого шага — включая `pnpm install`, который выполняет
# постустановочные скрипты зависимостей.
permissions:
  contents: read

# `git init` внутри actions/checkout не находит init.defaultBranch и на каждом
# job'е печатает девять строк подсказки «Using 'master' as the name for the
# initial branch...». Это не про репозиторий — раннер создаёт пустой .git с
# нуля, — но в логе выглядит ровно как предупреждение. Переменные
# GIT_CONFIG_* задают настройку без правки глобального конфига (который
# checkout всё равно подменяет на временный) и гасят подсказку.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: master

jobs:
  checks:
    name: Типы, линт, тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm НЕ задаётся здесь: action читает её из поля packageManager
      # в package.json. Раньше тут было жёстко прописано `version: 9`, а
      # lock-файл писался pnpm 11 — и `--frozen-lockfile` падал с
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, потому что pnpm 9 не читает секцию
      # overrides из pnpm-workspace.yaml (она переехала туда в pnpm 10+).
      # Единственный источник правды о версии — packageManager.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # ⚠ Боевые секреты сюда НЕ передаются, и это не упущение.
      #
      # Ни type-check, ни тесты подключения к базе не требуют, а схема
      # src/env.ts проверяет только форму значений: DATABASE_URI обязан быть
      # валидным URL, PAYLOAD_SECRET — непустым. Раньше в эти шаги уезжали
      # secrets.DATABASE_URI и secrets.PAYLOAD_SECRET — то есть боевая строка
      # подключения оказывалась в окружении job'а, где выполняется в том числе
      # код зависимостей.
      - name: Типы
        run: pnpm type-check
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci

      # Блокирует (с 21.10.2026): разовая уборка `biome check --write .` сняла
      # 295 ошибок, почти целиком форматирование. Сгенерированное
      # (payload-types.ts, снимки миграций *.json, importMap) из проверки
      # исключено в biome.json — его переписывает генератор.
      - name: Линт (biome)
        run: pnpm lint

      # Статический guard графа импортов payload.config.ts. Ни базы, ни сети
      # не требует — раньше зачем-то выполнялся на боевом сервере посреди
      # выкладки, в отдельно собираемом для этого Docker-образе.
      - name: Граф импортов payload.config.ts
        run: node scripts/verify-payload-graph.mjs

      # Регрессионные тесты: access control, open redirect, OTP, оформление
      # заказа — 101 проверка. Ни базы, ни сети не требуют. Падают — деплоить
      # нельзя.
      #
      # ⚠ Браузерных сценариев (tests/e2e) здесь нет намеренно: им нужен
      # отдельный раннер (`pnpm e2e:install`) и поднятый стенд. По той же
      # причине tests/e2e исключён из tsconfig.json — см. комментарий там.
      - name: Тесты
        run: pnpm test
        env:
          PAYLOAD_SECRET: ci-placeholder-secret
          DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci

  # Наборы, которым нужны настоящие Postgres и Redis: выдача сессии без
  # пароля и развилка Яндекс ID, удаление аккаунта через очередь BullMQ,
  # «Сообщить о поступлении», отзывы, чат поддержки (сокеты, гонки,
  # шифрование). База каждый раз чистая — схему создают те же миграции, что
  # на проде, так что заодно проверяется, что они проходят с нуля.
  #
  # Браузерные сценарии — отдельный job `e2e` ниже.
  integration:
    name: Интеграционные тесты (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # Только заглушки: база и Redis одноразовые, почта выключена
    # (EMAIL_ENABLED=false в самих скриптах), а SMTP_* нужны лишь потому, что
    # модуль почты проверяет форму конфига при старте.
    env:
      DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-placeholder-secret
      REDIS_HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      EMAIL_FROM_ADDRESS: ci@example.test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Мастер-ключ чата — случайный на каждый прогон: шифртексты живут
      # только в этой одноразовой базе.
      - name: Ключ шифрования чата
        run: echo "SUPPORT_ENCRYPTION_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Миграции с нуля
        run: pnpm payload:migrate

      - name: Яндекс ID
        run: pnpm test:oauth
      - name: Удаление аккаунта
        run: pnpm test:account-deletion
      - name: Сообщить о поступлении
        run: pnpm test:restock
      - name: Отзывы
        run: pnpm test:reviews
      - name: Чат поддержки
        run: pnpm test:support-chat

  # Браузерные сценарии на чистой базе: вход и регистрация через Яндекс ID (на
  # моке oauth.yandex.ru) и чат поддержки (покупатель и менеджер, шлюз
  # Socket.IO). Витрине нужен минимум — «Настройки сайта» с логотипом и
  # документы согласий: их заводит scripts/seed-storefront-ci.ts.
  #
  # Оформление заказа (playwright.config.ts) здесь не гоняется: ему нужен
  # каталог с опубликованными товарами и мок DaData — отдельная задача.
  e2e:
    name: Браузерные сценарии (Яндекс ID, чат)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URI: postgresql://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-placeholder-secret
      REDIS_HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      EMAIL_FROM_ADDRESS: ci@example.test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000
      SUPPORT_GATEWAY_PUBLIC_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # Playwright — в отдельном дереве tests/e2e/.runner (см.
      # playwright.config.ts), браузер — с системными зависимостями.
      # Конфиги и спеки лежат в tests/e2e и импортируют @playwright/test — Node
      # ищет его в tests/e2e/node_modules, поэтому туда — ссылка на раннер.
      - name: Playwright
        run: |
          npm --prefix tests/e2e/.runner ci
          ln -sfn .runner/node_modules tests/e2e/node_modules
          tests/e2e/.runner/node_modules/.bin/playwright install --with-deps chromium

      - name: Ключ шифрования чата
        run: echo "SUPPORT_ENCRYPTION_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Миграции и минимальная витрина
        run: |
          pnpm payload:migrate
          pnpm seed:storefront-ci

      - name: Яндекс ID
        run: pnpm test:e2e:yandex
      - name: Чат поддержки
        run: pnpm test:e2e:support

      - name: Артефакты упавших сценариев
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.output
          retention-days: 7

